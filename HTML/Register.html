<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <fieldset>
            <legend>Register Form</legend>

            <label for="name">Name :</label>
            <input type="text"  id="name" placeholder="Enter Ur Name"> 
            <br><br>
            <label for="age">Age :</label>
            <input type="number"  min="18" max="40" id="age" required placeholder="Enter Ur age"> 
            <br><br>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter Email">
            <br><br>
            <label for="phn">Phone No</label>
            <input type="tel" pattern="[6-9]{1}[0-9]{9}" id="phn" placeholder="+91">
            <br><br>

            <label for="">Gender</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
 

            <br><br>
            <label for="">State :</label>
            <select name="" id="">
                <option value="">Choose State</option>
                <option value="">KA</option>
                <option value="">AP</option>
                <option value="">KL</option>
                <option value="">TL</option>
            </select>

            <br><br>
            <label for="">Address</label>
            <textarea placeholder="Enter Full address" name="" id=""></textarea>
            <br><br>

            <button type="submit">Register</button>
            <button>Cancel</button>
        </fieldset>
    </form>
</body>

</html>
