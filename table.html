<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    
</head>

<body>

    <button>Click Here</button>

    <script>
        let table = document.createElement("table")
        let tr1 = document.createElement("tr")
        let tr2 = document.createElement("tr")
        let tr3 = document.createElement("tr")

        let th1 = document.createElement("th")
        let th2 = document.createElement("th")
        let th3 = document.createElement("th")

        let td1 = document.createElement("td")
        let td2 = document.createElement("td")
        let td3 = document.createElement("td")
        let td4 = document.createElement("td")
        let td5 = document.createElement("td")
        let td6 = document.createElement("td")

        table.appendChild(tr1)
        table.appendChild(tr2)
        table.appendChild(tr3)

        tr1.appendChild(th1)
        tr1.appendChild(th2)
        tr1.appendChild(th3)

        tr2.appendChild(td1)
        tr2.appendChild(td2)
        tr2.appendChild(td3)

        tr3.appendChild(td4)
        tr3.appendChild(td5)
        tr3.appendChild(td6)


        th1.innerText = "Name"
        th2.innerText = "Salary"
        th3.innerText = "Email"
        td1.innerText = "Anusha"
        td2.innerText = "98745"
        td3.innerText = "anusha@gmail.com"

        td4.innerText = "Raju"
        td5.innerText = 98774
        td6.innerText = 'raju@gmail.com'

        console.log(table);

        let bodyElement = document.querySelector("body")


        let btn = document.querySelector("button")
        table.border = 1
        table.cellPadding = 10
        table.cellSpacing = 0
        btn.addEventListener('click', () => {
            bodyElement.appendChild(table);
            let hashCode = Math.floor(Math.random() * 1000000)
            bodyElement.style.backgroundColor = `#${hashCode}`
            console.log(hashCode);
            

        })

        console.log(Math.floor(50.2));
        

    </script>
</body>

</html>
